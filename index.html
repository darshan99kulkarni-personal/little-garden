<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#f7dce8" />
  <meta name="description" content="A little garden made just for Nainart_g." />
  <title>A Little Garden for Nainart_g 🌸</title>
  <style>
    :root {
      --sky-top: #f8dce8;
      --sky-bottom: #d9e9f3;
      --ink: #68465e;
      --pink: #f4a9c5;
      --cream: #fff8ef;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      overflow-x: hidden;
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
      background: linear-gradient(180deg, var(--sky-top), var(--sky-bottom) 72%, #d5e8cf);
    }
    .scene {
      min-height: 100svh;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      isolation: isolate;
    }
    .sun {
      position: absolute; width: 150px; height: 150px; border-radius: 50%;
      top: 8%; right: 11%; background: #fff2cf; opacity: .75;
      box-shadow: 0 0 65px 24px rgba(255,239,198,.5); z-index: -2;
    }
    .cloud {
      position: absolute; width: 150px; height: 38px; border-radius: 50px;
      background: rgba(255,255,255,.48); filter: blur(1px); z-index: -1;
      animation: drift 34s linear infinite;
    }
    .cloud::before, .cloud::after {
      content: ""; position: absolute; bottom: 9px; border-radius: 50%;
      background: inherit;
    }
    .cloud::before { width: 62px; height: 62px; left: 23px; }
    .cloud::after { width: 47px; height: 47px; left: 68px; }
    .cloud.one { top: 18%; left: -170px; }
    .cloud.two { top: 34%; left: -220px; transform: scale(.7); animation-delay: -17s; }
    @keyframes drift { to { translate: calc(100vw + 450px) 0; } }

    header { text-align: center; padding: 8vh 18px 0; z-index: 3; }
    .eyebrow { letter-spacing: .22em; text-transform: uppercase; font: 11px/1.5 Arial,sans-serif; color: #9b6d8d; }
    h1 { font-size: clamp(2.15rem, 7vw, 4.4rem); font-weight: 400; margin: 12px 0 9px; color: #80546f; }
    .subtitle { font-size: clamp(1rem, 2.5vw, 1.2rem); margin: 0; color: #87657e; }
    .garden-wrap {
      width: 100%; max-width: 1100px; height: min(57vh, 510px);
      min-height: 330px; position: relative; margin-top: auto;
    }
    .hill {
      position: absolute; bottom: -90px; width: 125%; height: 240px; left: -12%;
      border-radius: 50% 50% 0 0 / 28% 28% 0 0;
      background: linear-gradient(180deg, #a8c99d, #709b79);
      box-shadow: inset 0 15px 25px rgba(255,255,255,.18);
    }
    .hill.back {
      bottom: 38px; left: -20%; height: 160px; width: 85%;
      background: linear-gradient(180deg, #c1d8b1, #9fbe96); opacity: .82;
    }
    .flower-bed { position: absolute; inset: 0 3% 0; }
    .flower {
      position: absolute; bottom: 8%; width: 68px; height: 160px;
      transform-origin: bottom center; opacity: 0;
      animation: grow 1.35s cubic-bezier(.2,.8,.2,1) forwards, sway 4s ease-in-out 1.35s infinite alternate;
    }
    @keyframes grow { from { opacity: 0; transform: scale(.05) rotate(8deg); } to { opacity: 1; transform: scale(1) rotate(0); } }
    @keyframes sway { from { rotate: -2deg; } to { rotate: 2deg; } }
    .stem {
      position: absolute; bottom: 0; left: 33px; width: 5px; height: 112px;
      background: linear-gradient(90deg,#477b52,#75a96b); border-radius: 8px;
      transform: scaleY(0); transform-origin: bottom; animation: stemGrow .8s ease-out forwards;
    }
    @keyframes stemGrow { to { transform: scaleY(1); } }
    .leaf {
      position: absolute; width: 29px; height: 14px; background: #6fa66e;
      border-radius: 100% 0 100% 0; bottom: 48px; left: 7px; transform: rotate(25deg);
    }
    .leaf.right { left: 35px; bottom: 72px; transform: rotate(75deg) scaleX(-1); }
    .head { position: absolute; left: 13px; bottom: 103px; width: 42px; height: 42px; }
    .petal {
      position: absolute; left: 13px; top: 0; width: 16px; height: 25px;
      border-radius: 60% 60% 45% 45%; transform-origin: 8px 21px;
      background: var(--flower); box-shadow: inset -2px -2px 4px rgba(120,50,80,.12);
    }
    .center {
      position: absolute; width: 15px; height: 15px; left: 13.5px; top: 13px;
      border-radius: 50%; background: #f8d66c; box-shadow: 0 0 0 2px rgba(255,255,255,.3);
    }
    .flower.tulip .head { width: 42px; height: 44px; }
    .flower.tulip .petal { height: 34px; width: 22px; left: 10px; top: 0; border-radius: 70% 70% 35% 35%; }
    .flower.tulip .petal:nth-child(2) { transform: rotate(-24deg); left: 1px; top: 7px; }
    .flower.tulip .petal:nth-child(3) { transform: rotate(24deg); left: 19px; top: 7px; }
    .flower.tulip .center { display: none; }
    .firefly, .butterfly, .sparkle {
      position: absolute; pointer-events: none; z-index: 2;
    }
    .firefly {
      width: 5px; height: 5px; border-radius: 50%; background: #fff6bd;
      box-shadow: 0 0 12px 4px rgba(255,245,180,.75);
      animation: float 6s ease-in-out infinite alternate;
    }
    @keyframes float { to { transform: translate(20px,-35px); opacity: .3; } }
    .butterfly { font-size: 24px; animation: flutter 9s ease-in-out infinite; filter: drop-shadow(0 2px 2px #9c7590); }
    @keyframes flutter { 0%,100% { transform: translate(0,0) rotate(-8deg); } 50% { transform: translate(65px,-48px) rotate(12deg); } }
    .message {
      position: relative; z-index: 4; text-align: center; padding: 18px 22px 34px;
      width: min(92%, 650px); margin: 0 auto 12px;
    }
    .message-card {
      display: inline-block; padding: 16px 25px 18px; border: 1px solid rgba(255,255,255,.72);
      border-radius: 22px; background: rgba(255,250,248,.57); backdrop-filter: blur(8px);
      box-shadow: 0 8px 30px rgba(115,83,105,.1);
    }
    .message-card p { font-size: clamp(1.12rem, 3vw, 1.55rem); line-height: 1.45; margin: 0; }
    .signature { margin-top: 8px !important; font: 11px Arial,sans-serif; letter-spacing: .14em; text-transform: uppercase; color: #a47792; }
    .controls { position: absolute; top: 18px; right: 18px; z-index: 5; }
    button {
      border: 1px solid rgba(255,255,255,.85); border-radius: 999px; padding: 10px 15px;
      color: #80546f; background: rgba(255,255,255,.48); font: 13px Arial,sans-serif;
      cursor: pointer; backdrop-filter: blur(8px);
    }
    button:hover { background: rgba(255,255,255,.8); }
    .hint { font: 11px Arial,sans-serif; color: #87657e; margin-top: 9px; opacity: .85; }
    @media (max-width: 520px) {
      header { padding-top: 10vh; }
      .garden-wrap { height: 48vh; min-height: 290px; }
      .flower { transform-origin: top left; }
      .flower-bed { inset: 0 0 0; }
      .hill { height: 190px; }
      .controls { top: 12px; right: 12px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; }
    }
  </style>
</head>
<body>
  <main class="scene">
    <div class="sun" aria-hidden="true"></div>
    <div class="cloud one" aria-hidden="true"></div>
    <div class="cloud two" aria-hidden="true"></div>
    <div class="controls"><button id="bloomAgain" type="button">↻ Grow again</button></div>

    <header>
      <div class="eyebrow">A little something for</div>
      <h1>nainart_g</h1>
      <p class="subtitle">A garden made just for you</p>
    </header>

    <section class="garden-wrap" aria-label="An animated garden of colorful flowers">
      <div class="hill back"></div>
      <div class="hill"></div>
      <div class="flower-bed" id="flowerBed"></div>
    </section>

    <section class="message">
      <div class="message-card">
        <p>You like flowers here is garden for you 🌸</p>
        <p class="signature">Made with a little love</p>
      </div>
      <div class="hint">Watch your garden bloom ✨</div>
    </section>
  </main>

  <script>
    (() => {
      const bed = document.getElementById("flowerBed");
      const colors = ["#f28eae", "#ffd36e", "#b89be8", "#f6a36f", "#fff0f4", "#e77b9b", "#a7c8ed", "#f3c4dc"];
      // Flower-head positions trace the numeral 4: two upright strokes
      // connected by a broad middle crossbar.
      const flowerPath = [
        [0, 0], [6, 0],
        [0, 1], [6, 1],
        [0, 2], [6, 2],
        [0, 3], [6, 3],
        [0, 4], [1, 4], [2, 4], [3, 4], [4, 4], [5, 4], [6, 4],
        [6, 5], [6, 6], [6, 7]
      ];

      function makeFlower(index, gridPoint) {
        const flower = document.createElement("div");
        const isTulip = index % 4 === 1;
        flower.className = "flower" + (isTulip ? " tulip" : "");
        const [column, row] = gridPoint;
        // Keep the flower numeral centered and scale its width for phones.
        flower.style.left = `${23 + column * 8.5}%`;
        flower.style.top = `${5 + row * 5.2}%`;
        flower.style.bottom = "auto";
        flower.style.transform = `scale(${0.76 + (index % 3) * 0.07})`;
        flower.style.animationDelay = `${index * 0.12}s, ${index * 0.12 + 1.35}s`;
        flower.style.zIndex = String(1 + Math.round(heights[index] * 3));

        const stem = document.createElement("div");
        stem.className = "stem";
        stem.style.height = `${92 + (index % 4) * 15}px`;
        stem.style.animationDelay = `${index * 0.28 + 0.2}s`;
        const leaf1 = document.createElement("span");
        leaf1.className = "leaf";
        const leaf2 = document.createElement("span");
        leaf2.className = "leaf right";
        stem.append(leaf1, leaf2);

        const head = document.createElement("div");
        head.className = "head";
        const color = colors[index % colors.length];
        for (let petalIndex = 0; petalIndex < 8; petalIndex++) {
          const petal = document.createElement("span");
          petal.className = "petal";
          petal.style.setProperty("--flower", color);
          petal.style.transform = `rotate(${petalIndex * 45}deg)`;
          if (isTulip && petalIndex > 2) continue;
          head.appendChild(petal);
        }
        const center = document.createElement("span");
        center.className = "center";
        head.appendChild(center);
        flower.append(stem, head);
        return flower;
      }

      function addAtmosphere() {
        document.querySelectorAll(".firefly, .butterfly").forEach(el => el.remove());
        for (let i = 0; i < 17; i++) {
          const dot = document.createElement("span");
          dot.className = "firefly";
          dot.style.left = `${5 + Math.random() * 90}%`;
          dot.style.top = `${15 + Math.random() * 65}%`;
          dot.style.animationDelay = `${Math.random() * 5}s`;
          document.querySelector(".scene").appendChild(dot);
        }
        ["🦋", "🦋"].forEach((symbol, i) => {
          const butterfly = document.createElement("span");
          butterfly.className = "butterfly";
          butterfly.textContent = symbol;
          butterfly.style.left = `${12 + i * 58}%`;
          butterfly.style.top = `${40 + i * 13}%`;
          butterfly.style.animationDelay = `${i * -3}s`;
          document.querySelector(".scene").appendChild(butterfly);
        });
      }

      function bloom() {
        bed.innerHTML = "";
        flowerPath.forEach((point, index) => bed.appendChild(makeFlower(index, point)));
        addAtmosphere();
      }
      document.getElementById("bloomAgain").addEventListener("click", bloom);
      bloom();
    })();
  </script>
</body>
</html>
