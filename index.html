<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f7dfeb">
<title>A Garden for nainart_g 🌸</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Georgia,serif}
body{overflow:hidden;color:#704b68;background:linear-gradient(180deg,#f8dce9,#e9e7f3 60%,#d9ead4)}
#scene{height:100svh;min-height:540px;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;text-align:center}
.glow{position:absolute;width:180px;height:180px;right:9%;top:8%;border-radius:50%;background:#fff1ce;box-shadow:0 0 75px 30px #fff0ce80}
.cloud{position:absolute;top:23%;left:-190px;width:150px;height:36px;border-radius:40px;background:#ffffff70;animation:cloud 34s linear infinite}
.cloud:before,.cloud:after{content:"";position:absolute;bottom:8px;border-radius:50%;background:inherit}.cloud:before{width:58px;height:58px;left:22px}.cloud:after{width:43px;height:43px;left:70px}
@keyframes cloud{to{transform:translateX(calc(100vw + 400px))}}
header{z-index:3;padding:8vh 18px 0;min-height:145px}.eyebrow{font:11px Arial,sans-serif;letter-spacing:.23em;text-transform:uppercase;color:#a17691}
h1{font-size:clamp(2rem,7vw,4rem);font-weight:400;margin:12px 0;color:#80566f;min-height:1.1em}
.subtitle{font-size:clamp(1rem,2.7vw,1.25rem);margin:0;color:#896b83;min-height:1.4em}
.garden{position:relative;width:100%;height:49vh;min-height:265px;max-height:500px;margin-top:auto;z-index:2}
.hill{position:absolute;bottom:-95px;left:-12%;width:124%;height:205px;border-radius:50% 50% 0 0/28% 28% 0 0;background:linear-gradient(#a9c99d,#709879)}
.hill.back{bottom:22px;left:-22%;width:90%;height:135px;background:linear-gradient(#c7dcb9,#9fbd94);opacity:.85}
#flowerLayer{position:absolute;inset:0;z-index:4;pointer-events:none}
.flower{position:absolute;opacity:0;transform:translateY(55px) scale(.15) rotate(-35deg);animation:bloom .95s cubic-bezier(.2,.8,.2,1) forwards;filter:drop-shadow(0 2px 2px #80556a24);line-height:1}
@keyframes bloom{65%{opacity:1;transform:translateY(-7px) scale(1.15) rotate(8deg)}100%{opacity:1;transform:translateY(0) scale(1) rotate(0)}}
.message-wrap{z-index:5;width:min(92%,740px);padding:12px 18px 35px;margin:auto auto 0}
.message-card{display:inline-block;padding:17px 25px;border:1px solid #ffffffbd;border-radius:24px;background:#fffaf5a8;backdrop-filter:blur(8px);box-shadow:0 10px 35px #72516a16;max-width:100%;min-height:64px}
#message{font-size:clamp(1.1rem,3.5vw,1.7rem);line-height:1.45;margin:0}
#note{font:11px Arial,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#a17c94;margin-top:9px}
.controls{position:absolute;right:13px;top:13px;z-index:10}
button{border:1px solid white;border-radius:99px;padding:9px 14px;background:#ffffff90;color:#80566f;font:12px Arial,sans-serif;cursor:pointer}
.progress{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);z-index:8;display:flex;gap:6px}
.progress i{width:6px;height:6px;border-radius:50%;background:#ffffff88;border:1px solid #9d7892}.progress i.active{background:#9d6688}
#scene.final .garden{height:58vh;max-height:590px}#scene.final header{padding-top:3vh}
@media(max-width:520px){header{padding-top:10vh}.garden{height:45vh}.controls{top:9px;right:9px}#scene.final .garden{height:55vh}}
@media(prefers-reduced-motion:reduce){.cloud,.flower{animation-duration:.01ms!important}}
</style>
</head>
<body>
<main id="scene">
<div class="glow"></div><div class="cloud"></div>
<div class="controls"><button id="replay" type="button">↻ Replay</button></div>
<header>
<div class="eyebrow" id="eyebrow">A little something for</div>
<h1 id="heading">nainart_g</h1>
<p class="subtitle" id="subtitle">A garden made just for you</p>
</header>
<section class="garden" aria-label="Flowers bloom and form a surprise">
<div class="hill back"></div><div class="hill"></div><div id="flowerLayer"></div>
</section>
<section class="message-wrap"><div class="message-card">
<p id="message">You like flowers, here is a garden for you. 🌸</p><div id="note">Made with a little love</div>
</div></section>
<div class="progress" id="progress"></div>
</main>
<script>
(()=>{
const $=id=>document.getElementById(id), layer=$('flowerLayer'), scene=$('scene');
const flowers=['🌸','🌼','🌺','🌷','💮','🌻','🪷'];
const slides=[
{eyebrow:'A little something for',heading:'nainart_g',subtitle:'A garden made just for you',message:'You like flowers, here is a garden for you.',note:'Made with a little love',type:'garden'},
{eyebrow:'For someone special',heading:'A little surprise',subtitle:'Every flower has its own way of blooming',message:'Some people make ordinary days feel a little more beautiful.',note:'And you are one of them ✨',type:'garden'},
{eyebrow:'A garden of little things',heading:'A few colors for you',subtitle:'Pink for sweetness · yellow for sunshine · purple for magic',message:'If smiles were flowers, I would make you a whole garden.',note:'Keep blooming 🌷',type:'garden'},
{eyebrow:'Watch closely',heading:'Made of flowers',subtitle:'A little garden, growing just for you',message:'And now, let the flowers make something special…',note:'',type:'garden'},
{eyebrow:'One little number',heading:'',subtitle:'Every flower finds its place',message:'',note:'',type:'four'},
{eyebrow:'For you, always',heading:'',subtitle:'',message:'',note:'',type:'words'}
];
let slide=0, timers=[];
function later(fn,ms){timers.push(setTimeout(fn,ms))}
function clearTimers(){timers.forEach(clearTimeout);timers=[]}
function addFlower(x,y,index,size,delay=0){
 const el=document.createElement('span');el.className='flower';el.textContent=flowers[index%flowers.length];
 el.style.left=x+'%';el.style.top=y+'%';el.style.fontSize=size+'px';el.style.animationDelay=delay+'ms';layer.appendChild(el);
}
function growGarden(){
 // Flowers appear in small waves, growing up from the garden bed.
 const positions=[];
 for(let row=0;row<3;row++)for(let col=0;col<9;col++){
  positions.push({x:5+col*11+((row%2)*4),y:61-row*20+Math.random()*8});
 }
 positions.forEach((p,i)=>addFlower(p.x,p.y,i,19+Math.random()*12,350+i*105));
 // A few butterflies drift in after the flowers have started blooming.
 later(()=>{['🦋','🦋'].forEach((b,i)=>{let e=document.createElement('span');e.className='flower';e.textContent=b;e.style.left=(13+i*66)+'%';e.style.top=(25+i*10)+'%';e.style.fontSize='23px';e.style.animationDelay=(i*300)+'ms';layer.appendChild(e)})},2600);
}
function flowerText(text,fontSize,top,maxWidth,lineHeight,size){
 const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d'),w=1000,h=460;canvas.width=w;canvas.height=h;
 ctx.fillStyle='#000';ctx.textAlign='center';ctx.textBaseline='middle';const lines=text.split('\n');ctx.font='bold '+fontSize+'px Georgia';
 lines.forEach((line,i)=>ctx.fillText(line,w/2,h/2+(i-(lines.length-1)/2)*lineHeight,maxWidth));
 const pixels=ctx.getImageData(0,0,w,h).data;let n=0,step=17;
 for(let y=0;y<h;y+=step)for(let x=0;x<w;x+=step)if(pixels[(y*w+x)*4+3]>80){
  addFlower(x/w*100,top+y/h*42,n++,size,450+n*18);
 }
}
function render(){
 clearTimers();layer.innerHTML='';scene.classList.toggle('final',slide>=4);
 const s=slides[slide];$('eyebrow').textContent=s.eyebrow;$('heading').textContent=s.heading;
 $('subtitle').textContent=s.subtitle;$('message').textContent=s.message;$('note').textContent=s.note;
 $('progress').innerHTML='';slides.forEach((_,i)=>{const dot=document.createElement('i');if(i===slide)dot.className='active';$('progress').appendChild(dot)});
 // Let the words arrive first; flowers begin growing automatically after a short pause.
 if(s.type==='garden')growGarden();
 if(s.type==='four')later(()=>flowerText('4',330,12,700,310,25),500);
 if(s.type==='words')later(()=>flowerText('SAB KUCH TUM MEIN\nKUCH NAHI',112,9,930,155,18),500);
 if(slide<slides.length-1)later(()=>{slide++;render()},8500);
}
$('replay').addEventListener('click',()=>{slide=0;render()});
render();
})();
</script>
</body></html>
