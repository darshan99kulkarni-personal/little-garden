<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For nainart_g</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,700&family=Montserrat:wght@300;400&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: radial-gradient(ellipse at bottom, #11221c 0%, #050a08 100%);
    font-family: 'Cormorant Garamond', Georgia, serif;
    color: #fffaf3;
    user-select: none;
  }

  #garden-canvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 1;
    display: block;
  }

  #slides-container {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 2;
    pointer-events: none;
  }

  .slide {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    text-align: center;
    opacity: 0;
    transform: scale(0.96);
    transition: opacity 1.3s ease-in-out, transform 1.3s ease-in-out;
  }

  .slide.active {
    opacity: 1;
    transform: scale(1);
  }

  /* Slide 1: Dedicated Opening */
  .intro-box {
    background: rgba(8, 16, 13, 0.42);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid rgba(255, 225, 190, 0.2);
    border-radius: 30px;
    padding: 2.8rem 3.4rem;
    max-width: 720px;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.55);
    animation: gentleFloat 6s ease-in-out infinite;
  }

  .sub-tag {
    font-family: 'Montserrat', sans-serif;
    font-size: 0.78rem;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: #e6be8a;
    margin-bottom: 1rem;
  }

  .intro-title {
    font-size: clamp(2rem, 4.6vw, 3.4rem);
    font-weight: 400;
    line-height: 1.28;
    color: #fffaf2;
    text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
  }

  .recipient-name {
    display: block;
    margin-top: 0.35rem;
    font-size: clamp(2.7rem, 5.8vw, 4.4rem);
    font-weight: 700;
    font-style: italic;
    background: linear-gradient(120deg, #ffe0b5 0%, #ffb5c8 50%, #ffe89e 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 0 20px rgba(255, 181, 200, 0.4));
  }

  /* Final Slide: Quote */
  .quote-box {
    background: rgba(8, 15, 12, 0.52);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 220, 165, 0.28);
    border-radius: 32px;
    padding: 3.2rem 3.8rem;
    max-width: 820px;
    box-shadow: 0 30px 70px rgba(0, 0, 0, 0.65), 0 0 50px rgba(255, 200, 140, 0.14);
  }

  .quote-text {
    font-size: clamp(2rem, 5vw, 3.7rem);
    font-weight: 700;
    letter-spacing: 0.08em;
    line-height: 1.35;
    background: linear-gradient(135deg, #fff6e6 0%, #ffd29d 50%, #ffacc7 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 22px rgba(255, 195, 140, 0.3));
  }

  /* Minimal Progress Indicator */
  .progress-dots {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    display: flex;
    gap: 10px;
    opacity: 0.7;
  }

  .p-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.3);
    transition: all 0.4s ease;
  }

  .p-dot.active {
    width: 24px;
    border-radius: 999px;
    background: linear-gradient(90deg, #ffd19b, #ff9ebb);
  }

  @keyframes gentleFloat {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-8px); }
  }

  @media (max-width: 600px) {
    .intro-box, .quote-box {
      padding: 2.1rem 1.5rem;
      margin: 0 1rem;
    }
  }
</style>
</head>
<body>

<canvas id="garden-canvas"></canvas>

<div id="slides-container">
  <!-- Slide 1: Opening -->
  <section class="slide active">
    <div class="intro-box">
      <div class="sub-tag">For The One &amp; Only</div>
      <h1 class="intro-title">
        You like flowers,<br>here is a garden for you
        <span class="recipient-name">nainart_g</span>
      </h1>
    </div>
  </section>

  <!-- Slide 2: Pure Full-Screen 3D Flowers & Butterflies (Zero text/names) -->
  <section class="slide"></section>

  <!-- Slide 3: Pure Full-Screen 3D Flowers & Butterflies (Zero text/names) -->
  <section class="slide"></section>

  <!-- Slide 4: Pure Full-Screen 3D Flowers & Butterflies (Zero text/names) -->
  <section class="slide"></section>

  <!-- Slide 5 (Second Last): Flowers Arranged in Number 4 (Zero text/names) -->
  <section class="slide"></section>

  <!-- Slide 6 (Last): Quote -->
  <section class="slide">
    <div class="quote-box">
      <div class="quote-text">“SAB KUCH TUM MEIN KUCH NAHI”</div>
    </div>
  </section>
</div>

<div class="progress-dots" id="progress-dots"></div>

<script>
(() => {
  const canvas = document.getElementById('garden-canvas');
  const ctx = canvas.getContext('2d');

  let width = canvas.width = window.innerWidth;
  let height = canvas.height = window.innerHeight;

  window.addEventListener('resize', () => {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
    buildSceneForSlide(currentSlide);
  });

  const slides = Array.from(document.querySelectorAll('.slide'));
  const totalSlides = slides.length;
  const dotsWrap = document.getElementById('progress-dots');
  let currentSlide = 0;

  slides.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'p-dot' + (i === 0 ? ' active' : '');
    dotsWrap.appendChild(d);
  });
  const dots = Array.from(document.querySelectorAll('.p-dot'));

  function goToSlide(index) {
    currentSlide = (index + totalSlides) % totalSlides;
    slides.forEach((s, i) => s.classList.toggle('active', i === currentSlide));
    dots.forEach((d, i) => d.classList.toggle('active', i === currentSlide));
    buildSceneForSlide(currentSlide);
  }

  // Automatic slideshow progression (also advances on tap/click anywhere)
  const SLIDE_DURATION = 5500;
  let autoInterval = setInterval(() => goToSlide(currentSlide + 1), SLIDE_DURATION);

  window.addEventListener('click', () => {
    clearInterval(autoInterval);
    goToSlide(currentSlide + 1);
    autoInterval = setInterval(() => goToSlide(currentSlide + 1), SLIDE_DURATION);
  });

  // Mouse / touch subtle 3D parallax
  let mouseX = 0, mouseY = 0, targetMouseX = 0, targetMouseY = 0;
  window.addEventListener('mousemove', (e) => {
    targetMouseX = (e.clientX / width - 0.5) * 2;
    targetMouseY = (e.clientY / height - 0.5) * 2;
  });

  let flowers = [];
  let butterflies = [];
  let fireflies = [];
  let fallingPetals = [];

  const PALETTES = {
    0: [ // Opening lush 3D garden
      { inner: '#ff2a5f', outer: '#ff9ebb', core: '#ffd166', style: 'rose' },
      { inner: '#ff7b00', outer: '#ffe066', core: '#5c2c06', style: 'sun' },
      { inner: '#9d4edd', outer: '#e0aaff', core: '#ffea00', style: 'lotus' },
      { inner: '#ff5d8f', outer: '#ffd6e0', core: '#ffbe0b', style: 'cosmos' }
    ],
    1: [ // Full-screen crimson, ruby & pink 3D blooms
      { inner: '#9b002c', outer: '#ff4d79', core: '#ffd166', style: 'rose' },
      { inner: '#c9184a', outer: '#ffccd5', core: '#ffb703', style: 'lotus' },
      { inner: '#ff0a54', outer: '#ff85a1', core: '#fff3b0', style: 'cosmos' }
    ],
    2: [ // Full-screen golden, amber & sunlit 3D blooms
      { inner: '#e85d04', outer: '#ffba08', core: '#370617', style: 'sun' },
      { inner: '#f48c06', outer: '#fff3b0', core: '#9d0208', style: 'cosmos' },
      { inner: '#ff6d00', outer: '#ffd6a5', core: '#6a040f', style: 'lotus' }
    ],
    3: [ // Full-screen lavender, violet & bluebell 3D blooms
      { inner: '#5a189a', outer: '#e0aaff', core: '#ffd166', style: 'lotus' },
      { inner: '#3c096c', outer: '#c77dff', core: '#ffea00', style: 'rose' },
      { inner: '#4361ee', outer: '#bde0fe', core: '#ffe66d', style: 'cosmos' }
    ],
    4: [ // Second-last slide: 3D flowers arranged in the shape of 4
      { inner: '#ff1e56', outer: '#ffac41', core: '#fff7ae', style: 'rose' },
      { inner: '#ff477e', outer: '#ffccd5', core: '#ffd166', style: 'lotus' },
      { inner: '#f77f00', outer: '#fcbf49', core: '#540b0e', style: 'sun' },
      { inner: '#b5179e', outer: '#f72585', core: '#ffe66d', style: 'cosmos' }
    ],
    5: [ // Final slide: Glowing blooms framing the quote
      { inner: '#ff758f', outer: '#fff0f3', core: '#ffd166', style: 'lotus' },
      { inner: '#f4a261', outer: '#fae1dd', core: '#e76f51', style: 'rose' }
    ]
  };

  function getNumber4Points(cx, cy, scale) {
    const rawPoints = [
      // Diagonal stroke
      [0.12, -0.85], [0.02, -0.68], [-0.08, -0.51], [-0.18, -0.34],
      [-0.28, -0.17], [-0.38, 0.0], [-0.48, 0.17],
      // Horizontal crossbar
      [-0.32, 0.17], [-0.16, 0.17], [0.0, 0.17], [0.16, 0.17],
      [0.32, 0.17], [0.46, 0.17],
      // Vertical stem
      [0.14, -0.62], [0.14, -0.42], [0.14, -0.22], [0.14, -0.02],
      [0.14, 0.36], [0.14, 0.55], [0.14, 0.74], [0.14, 0.90]
    ];
    return rawPoints.map(([px, py]) => ({
      x: cx + px * scale,
      y: cy + py * scale
    }));
  }

  function createFlower(x, y, z, palette, delay = 0, hasStem = true, customSize = null) {
    const baseSize = customSize || (30 + z * 38);
    return {
      x,
      y,
      z,
      baseSize,
      bloomProgress: 0,
      delay,
      palette,
      hasStem,
      swayPhase: Math.random() * Math.PI * 2,
      swaySpeed: 0.012 + Math.random() * 0.01,
      rotSpeed: (Math.random() - 0.5) * 0.0045,
      rotation: Math.random() * Math.PI * 2,
      tiltX: (Math.random() - 0.5) * 0.35,
      petalCount: palette.style === 'sun' ? 16 : (palette.style === 'rose' ? 10 : 8)
    };
  }

  function initParticles() {
    fireflies = Array.from({ length: 50 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      r: 1.5 + Math.random() * 2.5,
      vx: (Math.random() - 0.5) * 0.45,
      vy: (Math.random() - 0.5) * 0.45,
      phase: Math.random() * Math.PI * 2,
      hue: Math.random() > 0.3 ? 45 : 335
    }));

    fallingPetals = Array.from({ length: 32 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      size: 6 + Math.random() * 8,
      vy: 0.45 + Math.random() * 0.9,
      vx: (Math.random() - 0.5) * 0.65,
      rot: Math.random() * Math.PI * 2,
      vRot: (Math.random() - 0.5) * 0.03,
      flip: Math.random() * Math.PI,
      color: Math.random() > 0.5 ? 'rgba(255, 182, 193, 0.55)' : 'rgba(255, 223, 160, 0.5)'
    }));

    butterflies = Array.from({ length: 8 }, (_, i) => ({
      x: Math.random() * width,
      y: height * (0.15 + Math.random() * 0.65),
      z: 0.5 + Math.random() * 0.65,
      vx: (Math.random() > 0.5 ? 1 : -1) * (1.0 + Math.random() * 0.9),
      vy: (Math.random() - 0.5) * 0.65,
      wingPhase: Math.random() * Math.PI * 2,
      wingSpeed: 0.16 + Math.random() * 0.07,
      scale: 0.7 + Math.random() * 0.45,
      scheme: i % 3
    }));
  }

  function buildSceneForSlide(slideIdx) {
    flowers = [];
    const paletteSet = PALETTES[slideIdx] || PALETTES[0];

    if (slideIdx === 4) {
      // Second last slide: 3D flowers arranged in number 4
      const scale = Math.min(width * 0.44, height * 0.40);
      const pts = getNumber4Points(width * 0.5, height * 0.49, scale);
      pts.forEach((pt, idx) => {
        const pal = paletteSet[idx % paletteSet.length];
        const size = Math.max(25, scale * 0.16);
        flowers.push(createFlower(pt.x, pt.y, 0.88, pal, idx * 2.5, false, size));
      });
    } else if (slideIdx === 5) {
      // Final slide: Framing ring of 3D blooms around the quote
      const ringCount = 20;
      for (let i = 0; i < ringCount; i++) {
        const angle = (i / ringCount) * Math.PI * 2;
        const rx = Math.min(width * 0.44, 540);
        const ry = Math.min(height * 0.40, 350);
        const fx = width * 0.5 + Math.cos(angle) * rx;
        const fy = height * 0.49 + Math.sin(angle) * ry;
        const pal = paletteSet[i % paletteSet.length];
        flowers.push(createFlower(fx, fy, 0.75, pal, i * 2, false, 36));
      }
    } else {
      // Full-screen lush 3D garden meadow automatically blooming across the entire screen
      const count = width < 600 ? 24 : 38;
      for (let i = 0; i < count; i++) {
        const z = 0.25 + (i / count) * 0.88;
        const x = width * (0.04 + Math.random() * 0.92);
        const y = height * (0.18 + (1 - z) * 0.25 + Math.random() * 0.58);
        const pal = paletteSet[i % paletteSet.length];
        flowers.push(createFlower(x, y, z, pal, i * 1.8, true));
      }
      flowers.sort((a, b) => a.z - b.z);
    }
  }

  function draw3DFlower(f, time) {
    if (f.delay > 0) {
      f.delay -= 1;
      return;
    }
    f.bloomProgress += (1 - f.bloomProgress) * 0.048;
    const scale = f.bloomProgress;
    if (scale < 0.02) return;

    const sway = Math.sin(time * f.swaySpeed + f.swayPhase) * (11 * f.z);
    const parallaxX = mouseX * 28 * f.z;
    const parallaxY = mouseY * 18 * f.z;

    const fx = f.x + sway + parallaxX;
    const fy = f.y + parallaxY;
    const r = f.baseSize * scale;

    if (f.hasStem) {
      const groundY = height + 25;
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(fx, fy);
      ctx.quadraticCurveTo(fx - sway * 0.6, (fy + groundY) * 0.5, f.x + parallaxX * 0.4, groundY);
      const stemGrad = ctx.createLinearGradient(fx, fy, fx, groundY);
      stemGrad.addColorStop(0, '#3a7d44');
      stemGrad.addColorStop(1, '#12301e');
      ctx.strokeStyle = stemGrad;
      ctx.lineWidth = Math.max(2, 4.5 * f.z);
      ctx.stroke();

      const leafY = fy + (groundY - fy) * 0.35;
      const leafX = fx - sway * 0.25;
      drawLeaf(leafX, leafY, -0.65, 24 * f.z * scale);
      drawLeaf(leafX, leafY + 18 * f.z, 0.65, 21 * f.z * scale);
      ctx.restore();
    }

    ctx.save();
    ctx.translate(fx, fy);
    f.rotation += f.rotSpeed;
    ctx.rotate(f.rotation);

    const glow = ctx.createRadialGradient(0, 0, r * 0.1, 0, 0, r * 1.5);
    glow.addColorStop(0, f.palette.outer + '48');
    glow.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(0, 0, r * 1.5, 0, Math.PI * 2);
    ctx.fill();

    const tiers = [
      { count: f.petalCount, radius: r, width: r * 0.52, rotOffset: 0, alpha: 0.92 },
      { count: f.petalCount, radius: r * 0.74, width: r * 0.44, rotOffset: Math.PI / f.petalCount, alpha: 0.96 },
      { count: Math.max(5, Math.floor(f.petalCount * 0.7)), radius: r * 0.46, width: r * 0.34, rotOffset: 0.4, alpha: 1.0 }
    ];

    tiers.forEach((tier) => {
      for (let i = 0; i < tier.count; i++) {
        const angle = (i / tier.count) * Math.PI * 2 + tier.rotOffset;
        ctx.save();
        ctx.rotate(angle);

        const perspectiveScale = 1 - Math.abs(Math.sin(angle + f.tiltX)) * 0.14;
        ctx.scale(1, perspectiveScale);

        const grad = ctx.createLinearGradient(0, 0, 0, -tier.radius);
        grad.addColorStop(0, f.palette.inner);
        grad.addColorStop(0.65, f.palette.outer);
        grad.addColorStop(1, '#ffffff');

        ctx.globalAlpha = tier.alpha;
        ctx.fillStyle = grad;
        ctx.shadowColor = 'rgba(0, 0, 0, 0.35)';
        ctx.shadowBlur = 8 * f.z;
        ctx.shadowOffsetY = 4 * f.z;

        ctx.beginPath();
        ctx.moveTo(0, 0);
        if (f.palette.style === 'sun') {
          ctx.bezierCurveTo(-tier.width * 0.45, -tier.radius * 0.35, -tier.width * 0.3, -tier.radius * 0.85, 0, -tier.radius);
          ctx.bezierCurveTo(tier.width * 0.3, -tier.radius * 0.85, tier.width * 0.45, -tier.radius * 0.35, 0, 0);
        } else {
          ctx.bezierCurveTo(-tier.width, -tier.radius * 0.35, -tier.width * 0.85, -tier.radius * 0.95, 0, -tier.radius);
          ctx.bezierCurveTo(tier.width * 0.85, -tier.radius * 0.95, tier.width, -tier.radius * 0.35, 0, 0);
        }
        ctx.fill();

        ctx.strokeStyle = 'rgba(255, 255, 255, 0.22)';
        ctx.lineWidth = 0.8;
        ctx.beginPath();
        ctx.moveTo(0, -2);
        ctx.lineTo(0, -tier.radius * 0.72);
        ctx.stroke();

        ctx.restore();
      }
    });

    const coreRadius = r * 0.24;
    const coreGrad = ctx.createRadialGradient(-coreRadius * 0.3, -coreRadius * 0.3, coreRadius * 0.1, 0, 0, coreRadius);
    coreGrad.addColorStop(0, '#fff8d6');
    coreGrad.addColorStop(0.5, f.palette.core);
    coreGrad.addColorStop(1, '#2b1408');

    ctx.fillStyle = coreGrad;
    ctx.beginPath();
    ctx.arc(0, 0, coreRadius, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#fff3b0';
    for (let s = 0; s < 10; s++) {
      const sa = (s / 10) * Math.PI * 2;
      const sr = coreRadius * 1.18;
      ctx.beginPath();
      ctx.arc(Math.cos(sa) * sr, Math.sin(sa) * sr, Math.max(1.1, r * 0.032), 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  function drawLeaf(x, y, angle, size) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    const leafGrad = ctx.createLinearGradient(0, 0, size, 0);
    leafGrad.addColorStop(0, '#1f5130');
    leafGrad.addColorStop(1, '#52b788');
    ctx.fillStyle = leafGrad;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(size * 0.5, -size * 0.45, size, 0);
    ctx.quadraticCurveTo(size * 0.5, size * 0.45, 0, 0);
    ctx.fill();
    ctx.restore();
  }

  function draw3DButterfly(b) {
    b.wingPhase += b.wingSpeed;
    b.x += b.vx;
    b.y += b.vy + Math.sin(b.wingPhase * 0.25) * 0.55;

    if (b.x < -60) b.x = width + 60;
    if (b.x > width + 60) b.x = -60;
    if (b.y < 50) b.vy = Math.abs(b.vy);
    if (b.y > height - 70) b.vy = -Math.abs(b.vy);

    const flap = Math.cos(b.wingPhase);
    const wingScaleX = Math.max(0.18, Math.abs(flap));
    const heading = Math.atan2(b.vy, b.vx) + Math.PI / 2;

    const schemes = [
      { top: '#ff9e00', mid: '#ff5400', edge: '#1a0b00', dot: '#fff3b0' },
      { top: '#4cc9f0', mid: '#4361ee', edge: '#03045e', dot: '#caf0f8' },
      { top: '#ff85a1', mid: '#b5179e', edge: '#240046', dot: '#ffccd5' }
    ];
    const col = schemes[b.scheme];

    ctx.save();
    ctx.translate(b.x + mouseX * 35 * b.z, b.y + mouseY * 22 * b.z);
    ctx.rotate(heading);
    ctx.scale(b.scale, b.scale);

    [-1, 1].forEach((side) => {
      ctx.save();
      ctx.scale(side * wingScaleX, 1);

      const wingGrad = ctx.createRadialGradient(8, -6, 2, 18, -8, 28);
      wingGrad.addColorStop(0, col.top);
      wingGrad.addColorStop(0.75, col.mid);
      wingGrad.addColorStop(1, col.edge);

      ctx.fillStyle = wingGrad;
      ctx.shadowColor = 'rgba(0,0,0,0.4)';
      ctx.shadowBlur = 8;

      ctx.beginPath();
      ctx.moveTo(0, -2);
      ctx.bezierCurveTo(16, -24, 34, -18, 28, 2);
      ctx.bezierCurveTo(22, 8, 8, 5, 0, 2);
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(0, 2);
      ctx.bezierCurveTo(22, 4, 24, 22, 10, 24);
      ctx.bezierCurveTo(3, 22, 1, 12, 0, 4);
      ctx.fill();

      ctx.fillStyle = col.dot;
      ctx.beginPath();
      ctx.arc(21, -8, 2.2, 0, Math.PI * 2);
      ctx.arc(15, 13, 1.7, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    });

    ctx.fillStyle = '#1b1310';
    ctx.beginPath();
    ctx.ellipse(0, 2, 2.2, 11, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = 'rgba(255, 240, 220, 0.7)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(-1, -8);
    ctx.quadraticCurveTo(-5, -16, -8, -18);
    ctx.moveTo(1, -8);
    ctx.quadraticCurveTo(5, -16, 8, -18);
    ctx.stroke();

    ctx.restore();
  }

  function drawAtmosphere() {
    const bgGlow = ctx.createRadialGradient(width * 0.5, height * 0.45, 30, width * 0.5, height * 0.5, Math.max(width, height) * 0.75);
    bgGlow.addColorStop(0, 'rgba(42, 78, 62, 0.24)');
    bgGlow.addColorStop(0.55, 'rgba(16, 32, 26, 0.12)');
    bgGlow.addColorStop(1, 'rgba(4, 8, 7, 0)');
    ctx.fillStyle = bgGlow;
    ctx.fillRect(0, 0, width, height);

    fireflies.forEach((p) => {
      p.x += p.vx;
      p.y += p.vy;
      p.phase += 0.035;
      if (p.x < 0) p.x = width;
      if (p.x > width) p.x = 0;
      if (p.y < 0) p.y = height;
      if (p.y > height) p.y = 0;

      const alpha = 0.25 + (Math.sin(p.phase) * 0.5 + 0.5) * 0.65;
      ctx.save();
      ctx.fillStyle = `hsla(${p.hue}, 100%, 75%, ${alpha})`;
      ctx.shadowColor = `hsla(${p.hue}, 100%, 70%, 0.9)`;
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });

    fallingPetals.forEach((pt) => {
      pt.y += pt.vy;
      pt.x += pt.vx + Math.sin(pt.rot) * 0.4;
      pt.rot += pt.vRot;
      pt.flip += 0.04;
      if (pt.y > height + 20) {
        pt.y = -20;
        pt.x = Math.random() * width;
      }

      ctx.save();
      ctx.translate(pt.x, pt.y);
      ctx.rotate(pt.rot);
      ctx.scale(1, Math.cos(pt.flip));
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.ellipse(0, 0, pt.size, pt.size * 0.55, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });
  }

  let frameTime = 0;
  function animate() {
    frameTime += 1;
    mouseX += (targetMouseX - mouseX) * 0.05;
    mouseY += (targetMouseY - mouseY) * 0.05;

    ctx.clearRect(0, 0, width, height);

    drawAtmosphere();
    flowers.forEach((f) => draw3DFlower(f, frameTime));
    butterflies.forEach((b) => draw3DButterfly(b));

    requestAnimationFrame(animate);
  }

  initParticles();
  buildSceneForSlide(0);
  animate();
})();
</script>
</body>
