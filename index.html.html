<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Garden for @nainart_g</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #060d0a;
    font-family: 'Cormorant Garamond', Georgia, serif;
    color: #fffaf3;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  #garden-canvas {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 1;
    display: block;
  }

  /* Cinematic vignette & warm sunlight haze */
  .vignette-overlay {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background:
      radial-gradient(circle at 50% 25%, rgba(255, 224, 178, 0.10) 0%, transparent 55%),
      radial-gradient(ellipse at center, transparent 52%, rgba(2, 6, 4, 0.72) 100%);
  }

  #slides-container {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: 3;
    pointer-events: none;
  }

  .slide {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    text-align: center;
    opacity: 0;
    transform: translateY(10px) scale(0.98);
    transition: opacity 1.35s cubic-bezier(0.22, 1, 0.36, 1), transform 1.35s cubic-bezier(0.22, 1, 0.36, 1);
  }

  .slide.active {
    opacity: 1;
    transform: translateY(0) scale(1);
  }

  /* Slide 1: Top quote & bottom @nainart_g leaving center open for realistic blooms */
  .slide.slide-intro {
    justify-content: space-between;
    padding-top: clamp(2rem, 5vh, 3.6rem);
    padding-bottom: clamp(3.4rem, 7vh, 5rem);
  }

  .top-banner {
    background: linear-gradient(135deg, rgba(14, 24, 19, 0.58), rgba(24, 16, 20, 0.48));
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 232, 198, 0.25);
    border-radius: 999px;
    padding: 1rem 2.4rem;
    max-width: 92vw;
    box-shadow: 0 18px 45px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.15);
  }

  .intro-title {
    font-size: clamp(1.35rem, 3.3vw, 2.35rem);
    font-weight: 600;
    letter-spacing: 0.02em;
    line-height: 1.25;
    color: #fff9ef;
    text-shadow: 0 2px 14px rgba(0, 0, 0, 0.55);
  }

  .bottom-dedication {
    background: linear-gradient(135deg, rgba(16, 22, 19, 0.55), rgba(32, 16, 24, 0.48));
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 205, 220, 0.28);
    border-radius: 999px;
    padding: 0.7rem 2.2rem;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
    animation: softFloat 5s ease-in-out infinite;
  }

  .recipient-handle {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(1.75rem, 4.2vw, 2.9rem);
    font-weight: 700;
    font-style: italic;
    letter-spacing: 0.03em;
    background: linear-gradient(120deg, #ffe7c2 0%, #ffb7ce 52%, #ffe39f 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 2px 14px rgba(255, 175, 200, 0.42));
  }

  /* Final Slide: Quote */
  .quote-card {
    background: linear-gradient(145deg, rgba(12, 20, 16, 0.62), rgba(26, 14, 20, 0.55));
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 224, 176, 0.3);
    border-radius: 32px;
    padding: 2.8rem 3.4rem;
    max-width: 840px;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.68), 0 0 60px rgba(255, 195, 145, 0.14);
  }

  .quote-text {
    font-family: 'Playfair Display', Georgia, serif;
    font-size: clamp(1.85rem, 4.6vw, 3.4rem);
    font-weight: 700;
    letter-spacing: 0.06em;
    line-height: 1.35;
    background: linear-gradient(135deg, #fff8eb 0%, #ffd59e 50%, #ffacc7 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 20px rgba(255, 190, 140, 0.3));
  }

  /* Subtle Progress Dots */
  .progress-dots {
    position: fixed;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    display: flex;
    gap: 9px;
    opacity: 0.78;
  }

  .p-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: rgba(255, 245, 230, 0.28);
    transition: all 0.45s ease;
  }

  .p-dot.active {
    width: 24px;
    border-radius: 999px;
    background: linear-gradient(90deg, #ffd49e, #ffa3c2);
  }

  @keyframes softFloat {
    0%, 100% { transform: translateY(0px); }
    50% { transform: translateY(-6px); }
  }

  @media (max-width: 600px) {
    .top-banner {
      padding: 0.85rem 1.4rem;
      border-radius: 22px;
    }
    .bottom-dedication {
      padding: 0.6rem 1.6rem;
    }
    .quote-card {
      padding: 2rem 1.4rem;
      margin: 0 0.8rem;
    }
  }
</style>
</head>
<body>

<canvas id="garden-canvas"></canvas>
<div class="vignette-overlay"></div>

<div id="slides-container">
  <!-- Slide 1: Quote at Top & @nainart_g at Bottom -->
  <section class="slide slide-intro active">
    <div class="top-banner">
      <h1 class="intro-title">You like flower here is garden for you</h1>
    </div>
    <div class="bottom-dedication">
      <div class="recipient-handle">@nainart_g</div>
    </div>
  </section>

  <!-- Slide 2: Pure Full-Screen Realistic Botanical Blooms -->
  <section class="slide"></section>

  <!-- Slide 3: Pure Full-Screen Golden & Sunset Blooms -->
  <section class="slide"></section>

  <!-- Slide 4: Pure Full-Screen Twilight Orchid & Peony Blooms -->
  <section class="slide"></section>

  <!-- Slide 5 (Second Last): Realistic Flowers Arranged in Number 4 -->
  <section class="slide"></section>

  <!-- Slide 6 (Last): Quote -->
  <section class="slide">
    <div class="quote-card">
      <div class="quote-text">“SAB KUCH TUM MEIN KUCH NAHI”</div>
    </div>
  </section>
</div>

<div class="progress-dots" id="progress-dots"></div>

<script>
(() => {
  const canvas = document.getElementById('garden-canvas');
  const ctx = canvas.getContext('2d');

  let width = 0;
  let height = 0;
  let dpr = Math.min(window.devicePixelRatio || 1, 2);

  function resizeCanvas() {
    width = window.innerWidth;
    height = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  window.addEventListener('resize', () => {
    resizeCanvas();
    buildSceneForSlide(currentSlide);
  });

  const slides = Array.from(document.querySelectorAll('.slide'));
  const totalSlides = slides.length;
  const dotsWrap = document.getElementById('progress-dots');
  let currentSlide = 0;

  slides.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'p-dot' + (i === 0 ? ' active' : '');
    dotsWrap.appendChild(d);
  });
  const dots = Array.from(document.querySelectorAll('.p-dot'));

  function goToSlide(index) {
    currentSlide = (index + totalSlides) % totalSlides;
    slides.forEach((s, i) => s.classList.toggle('active', i === currentSlide));
    dots.forEach((d, i) => d.classList.toggle('active', i === currentSlide));
    buildSceneForSlide(currentSlide);
  }

  const SLIDE_DURATION = 6200;
  let autoInterval = setInterval(() => goToSlide(currentSlide + 1), SLIDE_DURATION);

  window.addEventListener('click', () => {
    clearInterval(autoInterval);
    goToSlide(currentSlide + 1);
    autoInterval = setInterval(() => goToSlide(currentSlide + 1), SLIDE_DURATION);
  });

  let mouseX = 0, mouseY = 0, targetMouseX = 0, targetMouseY = 0;
  window.addEventListener('mousemove', (e) => {
    targetMouseX = (e.clientX / width - 0.5) * 2;
    targetMouseY = (e.clientY / height - 0.5) * 2;
  });
  window.addEventListener('touchmove', (e) => {
    if (e.touches && e.touches[0]) {
      targetMouseX = (e.touches[0].clientX / width - 0.5) * 2;
      targetMouseY = (e.touches[0].clientY / height - 0.5) * 2;
    }
  }, { passive: true });

  // Pre-rendered organic silk/velvet petal grain texture for realistic shading
  const grainCanvas = document.createElement('canvas');
  grainCanvas.width = 160;
  grainCanvas.height = 160;
  const gCtx = grainCanvas.getContext('2d');
  for (let x = 0; x < 160; x++) {
    for (let y = 0; y < 160; y++) {
      const wave = Math.sin(x * 0.45) * 14 + Math.cos(y * 0.12) * 8;
      const noise = (Math.random() - 0.5) * 18;
      const v = Math.max(0, Math.min(255, 128 + wave + noise));
      gCtx.fillStyle = `rgba(${v},${v},${v},0.065)`;
      gCtx.fillRect(x, y, 1, 1);
    }
  }
  const petalGrainPattern = ctx.createPattern(grainCanvas, 'repeat');

  // Pre-rendered soft bokeh background orbs for photographic depth-of-field
  let bokehOrbs = [];
  let flowers = [];
  let grassBlades = [];
  let butterflies = [];
  let pollen = [];
  let fallingPetals = [];

  // Realistic botanical species configurations
  const SPECIES_PALETTES = {
    0: [ // Slide 1: Lush English Garden (David Austin Roses, Blushing Peonies, Stargazer Lilies, Wild Poppies)
      { type: 'englishRose', base: '#7a0926', mid: '#d62856', tip: '#ff9ebb', edge: '#ffe3ec', core: '#ffd166' },
      { type: 'peony', base: '#9e1946', mid: '#f26a8d', tip: '#ffccd5', edge: '#fff5f7', core: '#ffbe0b' },
      { type: 'lily', base: '#4a6b1d', mid: '#c9184a', tip: '#ff8fa3', edge: '#fff0f3', core: '#d97706', spots: '#590d22' },
      { type: 'poppy', base: '#2b0504', mid: '#d00000', tip: '#ff5400', edge: '#ff9e00', core: '#1b1b1b' },
      { type: 'englishRose', base: '#b5441c', mid: '#f48c06', tip: '#ffd6a5', edge: '#fff3e0', core: '#ffea00' }
    ],
    1: [ // Slide 2: Crimson & Velvet Rose & Peony Sanctuary
      { type: 'englishRose', base: '#590016', mid: '#a4133c', tip: '#ff4d6d', edge: '#ffb3c1', core: '#ffb703' },
      { type: 'peony', base: '#800f2f', mid: '#c9184a', tip: '#ff758f', edge: '#ffe5ec', core: '#ffd166' },
      { type: 'lily', base: '#386641', mid: '#b5179e', tip: '#f72585', edge: '#ffd6ff', core: '#f4a261', spots: '#3c096c' },
      { type: 'englishRose', base: '#8f2d56', mid: '#d81159', tip: '#ff8fab', edge: '#fff0f5', core: '#ffe66d' }
    ],
    2: [ // Slide 3: Sunlit Marigold, Sunflower & Apricot Rose Meadow
      { type: 'sunflower', base: '#7f2704', mid: '#f59e0b', tip: '#fde047', edge: '#fef9c3', core: '#271306' },
      { type: 'englishRose', base: '#9c2c13', mid: '#e85d04', tip: '#ffba08', edge: '#fff3b0', core: '#ffd166' },
      { type: 'poppy', base: '#370617', mid: '#dc2f02', tip: '#f48c06', edge: '#ffccd5', core: '#1f1300' },
      { type: 'peony', base: '#b5651d', mid: '#f4a261', tip: '#ffe5d9', edge: '#ffffff', core: '#e76f51' }
    ],
    3: [ // Slide 4: Twilight Lavender Peony, Lotus & Iris Garden
      { type: 'peony', base: '#3c096c', mid: '#7b2cbf', tip: '#e0aaff', edge: '#f8edeb', core: '#ffd166' },
      { type: 'lily', base: '#2d6a4f', mid: '#5a189a', tip: '#c77dff', edge: '#f3d5ff', core: '#ffb703', spots: '#240046' },
      { type: 'englishRose', base: '#4a154b', mid: '#9d4edd', tip: '#ffccd5', edge: '#fff0f6', core: '#ffe66d' }
    ],
    4: [ // Slide 5: Number 4 in Full Bloom
      { type: 'englishRose', base: '#6a040f', mid: '#d00000', tip: '#ff758f', edge: '#ffccd5', core: '#ffd166' },
      { type: 'peony', base: '#9d0208', mid: '#f48c06', tip: '#ffba08', edge: '#fff3b0', core: '#ffffff' },
      { type: 'lily', base: '#386641', mid: '#c9184a', tip: '#ff8fa3', edge: '#fff0f3', core: '#ffb703', spots: '#590d22' }
    ],
    5: [ // Slide 6: Floral Wreath Framing Final Quote
      { type: 'englishRose', base: '#7a0926', mid: '#e05780', tip: '#ffc2d1', edge: '#fff0f3', core: '#ffd166' },
      { type: 'peony', base: '#9c4221', mid: '#f6ad55', tip: '#feebc8', edge: '#ffffff', core: '#fbd38d' }
    ]
  };

  function getNumber4Points(cx, cy, scale) {
    const rawPoints = [
      // Diagonal stroke
      [0.12, -0.84], [0.02, -0.67], [-0.08, -0.50], [-0.18, -0.33],
      [-0.28, -0.16], [-0.38, 0.01], [-0.48, 0.18],
      // Crossbar
      [-0.32, 0.18], [-0.16, 0.18], [0.0, 0.18], [0.16, 0.18],
      [0.32, 0.18], [0.46, 0.18],
      // Vertical stem
      [0.14, -0.62], [0.14, -0.42], [0.14, -0.22], [0.14, -0.02],
      [0.14, 0.36], [0.14, 0.55], [0.14, 0.74], [0.14, 0.90]
    ];
    return rawPoints.map(([px, py]) => ({
      x: cx + px * scale,
      y: cy + py * scale
    }));
  }

  function createRealisticFlower(x, y, z, species, delay = 0, hasStem = true, customSize = null) {
    const baseSize = customSize || (36 + z * 46);
    // Deterministic petal ruffle seeds so petals look organically crinkled without jittering
    const ruffleSeeds = Array.from({ length: 48 }, () => ({
      w1: (Math.random() - 0.5) * 0.22,
      w2: (Math.random() - 0.5) * 0.22,
      lenVar: 0.90 + Math.random() * 0.20,
      hasDew: Math.random() > 0.78,
      dewX: (Math.random() - 0.5) * 0.45,
      dewY: 0.38 + Math.random() * 0.38,
      dewR: 1.5 + Math.random() * 2.2
    }));

    return {
      x,
      y,
      z,
      baseSize,
      bloomProgress: 0,
      delay,
      species,
      hasStem,
      swayPhase: Math.random() * Math.PI * 2,
      swaySpeed: 0.011 + Math.random() * 0.008,
      rotation: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.0022,
      tiltAngle: (Math.random() - 0.5) * 0.5,
      tiltAmount: 0.72 + Math.random() * 0.26, // Natural 3D angle facing viewer
      ruffleSeeds,
      leafSide: Math.random() > 0.5 ? 1 : -1
    };
  }

  function initEnvironment() {
    bokehOrbs = Array.from({ length: 28 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      r: 35 + Math.random() * 110,
      color: Math.random() > 0.45
        ? 'rgba(255, 198, 130, 0.055)'
        : (Math.random() > 0.5 ? 'rgba(255, 135, 175, 0.05)' : 'rgba(92, 184, 132, 0.06)'),
      vx: (Math.random() - 0.5) * 0.15,
      vy: (Math.random() - 0.5) * 0.15
    }));

    pollen = Array.from({ length: 55 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      r: 1.1 + Math.random() * 2.1,
      vx: (Math.random() - 0.5) * 0.32,
      vy: -0.15 - Math.random() * 0.35,
      phase: Math.random() * Math.PI * 2
    }));

    fallingPetals = Array.from({ length: 24 }, () => ({
      x: Math.random() * width,
      y: Math.random() * height,
      size: 7 + Math.random() * 8,
      vy: 0.42 + Math.random() * 0.75,
      vx: (Math.random() - 0.5) * 0.6,
      rot: Math.random() * Math.PI * 2,
      vRot: (Math.random() - 0.5) * 0.025,
      flip: Math.random() * Math.PI,
      c1: Math.random() > 0.4 ? '#ff8fa3' : '#ffd166',
      c2: '#fff0f3'
    }));

    butterflies = Array.from({ length: 6 }, (_, i) => ({
      x: Math.random() * width,
      y: height * (0.2 + Math.random() * 0.55),
      z: 0.6 + Math.random() * 0.5,
      vx: (Math.random() > 0.5 ? 1 : -1) * (0.9 + Math.random() * 0.75),
      vy: (Math.random() - 0.5) * 0.5,
      wingPhase: Math.random() * Math.PI * 2,
      wingSpeed: 0.15 + Math.random() * 0.06,
      scale: 0.72 + Math.random() * 0.35,
      scheme: i % 3
    }));
  }

  function buildSceneForSlide(slideIdx) {
    flowers = [];
    grassBlades = [];
    const paletteSet = SPECIES_PALETTES[slideIdx] || SPECIES_PALETTES[0];

    if (slideIdx === 4) {
      const scale = Math.min(width * 0.43, height * 0.39);
      const pts = getNumber4Points(width * 0.5, height * 0.49, scale);
      pts.forEach((pt, idx) => {
        const sp = paletteSet[idx % paletteSet.length];
        const size = Math.max(28, scale * 0.165);
        flowers.push(createRealisticFlower(pt.x, pt.y, 0.9, sp, idx * 2, false, size));
      });
    } else if (slideIdx === 5) {
      const ringCount = 18;
      for (let i = 0; i < ringCount; i++) {
        const angle = (i / ringCount) * Math.PI * 2;
        const rx = Math.min(width * 0.44, 540);
        const ry = Math.min(height * 0.40, 350);
        const fx = width * 0.5 + Math.cos(angle) * rx;
        const fy = height * 0.49 + Math.sin(angle) * ry;
        const sp = paletteSet[i % paletteSet.length];
        flowers.push(createRealisticFlower(fx, fy, 0.8, sp, i * 2, false, 40));
      }
    } else {
      // Lush foreground grass blades for grounded garden realism
      const bladeCount = width < 600 ? 45 : 85;
      for (let g = 0; g < bladeCount; g++) {
        grassBlades.push({
          x: Math.random() * width,
          h: height * (0.14 + Math.random() * 0.24),
          lean: (Math.random() - 0.5) * 55,
          w: 2.5 + Math.random() * 3.5,
          phase: Math.random() * Math.PI * 2,
          shade: Math.random() > 0.5 ? '#1b4332' : '#2d6a4f'
        });
      }

      // Rich layered botanical garden
      const count = width < 600 ? 18 : 28;
      for (let i = 0; i < count; i++) {
        const z = 0.28 + (i / count) * 0.85;
        const x = width * (0.06 + Math.random() * 0.88);
        // Keep center slightly framed on Slide 1 so both text & centerpiece flowers shine
        const yMin = slideIdx === 0 ? 0.24 : 0.18;
        const y = height * (yMin + (1 - z) * 0.24 + Math.random() * 0.52);
        const sp = paletteSet[i % paletteSet.length];
        flowers.push(createRealisticFlower(x, y, z, sp, i * 1.6, true));
      }
      flowers.sort((a, b) => a.z - b.z);
    }
  }

  function drawDewdrop(x, y, r) {
    if (r < 1.3) return;
    ctx.save();
    ctx.translate(x, y);
    // Tiny shadow under water droplet
    ctx.fillStyle = 'rgba(0, 0, 0, 0.28)';
    ctx.beginPath();
    ctx.ellipse(0.8, 1.2, r * 1.05, r * 0.85, 0, 0, Math.PI * 2);
    ctx.fill();

    // Translucent water body
    const dropGrad = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.1, 0, 0, r);
    dropGrad.addColorStop(0, 'rgba(255, 255, 255, 0.85)');
    dropGrad.addColorStop(0.55, 'rgba(255, 255, 255, 0.22)');
    dropGrad.addColorStop(1, 'rgba(255, 255, 255, 0.65)');
    ctx.fillStyle = dropGrad;
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.fill();

    // Specular pinpoint glint
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(-r * 0.34, -r * 0.34, r * 0.28, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawBotanicalLeaf(x, y, angle, size) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);

    ctx.shadowColor = 'rgba(0, 0, 0, 0.45)';
    ctx.shadowBlur = 8;
    ctx.shadowOffsetY = 4;

    const grad = ctx.createLinearGradient(0, -size * 0.35, size, size * 0.35);
    grad.addColorStop(0, '#143624');
    grad.addColorStop(0.45, '#2d6a4f');
    grad.addColorStop(0.85, '#52b788');
    grad.addColorStop(1, '#74c69d');

    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    // Serrated rose/peony leaflet silhouette
    ctx.bezierCurveTo(size * 0.28, -size * 0.44, size * 0.72, -size * 0.38, size, 0);
    ctx.bezierCurveTo(size * 0.72, size * 0.38, size * 0.28, size * 0.44, 0, 0);
    ctx.fill();

    // Midrib and lateral veins
    ctx.shadowColor = 'transparent';
    ctx.strokeStyle = 'rgba(183, 228, 199, 0.38)';
    ctx.lineWidth = 1.1;
    ctx.beginPath();
    ctx.moveTo(2, 0);
    ctx.quadraticCurveTo(size * 0.5, -size * 0.04, size * 0.92, 0);
    ctx.stroke();

    ctx.lineWidth = 0.7;
    for (let v = 1; v <= 4; v++) {
      const vx = size * (v * 0.18);
      ctx.beginPath();
      ctx.moveTo(vx, 0);
      ctx.lineTo(vx + size * 0.12, -size * 0.18);
      ctx.moveTo(vx, 0);
      ctx.lineTo(vx + size * 0.12, size * 0.18);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawRealisticBloom(f, time) {
    if (f.delay > 0) {
      f.delay -= 1;
      return;
    }
    f.bloomProgress += (1 - f.bloomProgress) * 0.045;
    const bloom = f.bloomProgress;
    if (bloom < 0.02) return;

    const sway = Math.sin(time * f.swaySpeed + f.swayPhase) * (10 * f.z);
    const px = mouseX * 26 * f.z;
    const py = mouseY * 16 * f.z;

    const fx = f.x + sway + px;
    const fy = f.y + py;
    const r = f.baseSize * bloom;
    const sp = f.species;

    // 1. Curved organic botanical stem & compound leaves
    if (f.hasStem) {
      const groundY = height + 30;
      const ctrlX = fx - sway * 0.65;
      const ctrlY = (fy + groundY) * 0.52;
      const baseX = f.x + px * 0.35;

      ctx.save();
      const stemGrad = ctx.createLinearGradient(fx, fy, baseX, groundY);
      stemGrad.addColorStop(0, '#40916c');
      stemGrad.addColorStop(0.5, '#2d6a4f');
      stemGrad.addColorStop(1, '#081c15');

      ctx.strokeStyle = stemGrad;
      ctx.lineWidth = Math.max(2.2, 5.2 * f.z);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(fx, fy + r * 0.15);
      ctx.quadraticCurveTo(ctrlX, ctrlY, baseX, groundY);
      ctx.stroke();

      // Highlight edge on stem
      ctx.strokeStyle = 'rgba(149, 213, 178, 0.32)';
      ctx.lineWidth = Math.max(0.8, 1.4 * f.z);
      ctx.beginPath();
      ctx.moveTo(fx - 1.2 * f.z, fy + r * 0.15);
      ctx.quadraticCurveTo(ctrlX - 1.2 * f.z, ctrlY, baseX - 1.2 * f.z, groundY);
      ctx.stroke();

      // Natural leaves along stem
      const l1x = fx - sway * 0.25;
      const l1y = fy + (groundY - fy) * 0.32;
      drawBotanicalLeaf(l1x, l1y, -0.58 * f.leafSide, 32 * f.z * bloom);
      drawBotanicalLeaf(l1x, l1y + 22 * f.z, 0.55 * f.leafSide, 28 * f.z * bloom);
      ctx.restore();
    }

    // 2. Flower head with 3D tilt perspective
    ctx.save();
    ctx.translate(fx, fy);

    // Soft ambient shadow beneath the whole blossom
    const underShadow = ctx.createRadialGradient(0, r * 0.18, r * 0.1, 0, r * 0.18, r * 1.35);
    underShadow.addColorStop(0, 'rgba(0, 0, 0, 0.52)');
    underShadow.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = underShadow;
    ctx.beginPath();
    ctx.arc(0, r * 0.18, r * 1.35, 0, Math.PI * 2);
    ctx.fill();

    // Subtle 3D foreshortening
    ctx.rotate(f.tiltAngle);
    ctx.scale(1, f.tiltAmount);
    ctx.rotate(-f.tiltAngle);

    f.rotation += f.rotSpeed;
    ctx.rotate(f.rotation);

    if (sp.type === 'englishRose' || sp.type === 'peony') {
      // Multi-tiered cupped silk/velvet petals with heart-notched ruffled margins & ambient occlusion
      const isPeony = sp.type === 'peony';
      const rings = isPeony
        ? [
            { count: 11, rad: r * 1.04, wid: r * 0.62, rot: 0.0, shade: 0.88 },
            { count: 10, rad: r * 0.86, wid: r * 0.56, rot: 0.31, shade: 0.93 },
            { count: 9,  rad: r * 0.68, wid: r * 0.48, rot: 0.65, shade: 0.96 },
            { count: 8,  rad: r * 0.48, wid: r * 0.38, rot: 0.22, shade: 0.99 },
            { count: 6,  rad: r * 0.28, wid: r * 0.26, rot: 0.52, shade: 1.0 }
          ]
        : [
            { count: 7, rad: r * 1.02, wid: r * 0.68, rot: 0.0, shade: 0.90 },
            { count: 7, rad: r * 0.82, wid: r * 0.58, rot: 0.45, shade: 0.94 },
            { count: 6, rad: r * 0.62, wid: r * 0.48, rot: 0.92, shade: 0.97 },
            { count: 5, rad: r * 0.42, wid: r * 0.36, rot: 0.35, shade: 1.0 },
            { count: 4, rad: r * 0.24, wid: r * 0.24, rot: 0.80, shade: 1.0 }
          ];

      let seedIdx = 0;
      rings.forEach((ring, rIndex) => {
        for (let i = 0; i < ring.count; i++) {
          const seed = f.ruffleSeeds[seedIdx++ % f.ruffleSeeds.length];
          const angle = (i / ring.count) * Math.PI * 2 + ring.rot;
          const pLen = ring.rad * seed.lenVar;
          const pWid = ring.wid;

          ctx.save();
          ctx.rotate(angle);

          // Cast shadow onto lower petals for genuine 3D depth
          ctx.shadowColor = 'rgba(12, 2, 6, 0.55)';
          ctx.shadowBlur = (7 - rIndex) * 1.8 * f.z;
          ctx.shadowOffsetY = 3 * f.z;

          const grad = ctx.createRadialGradient(0, -pLen * 0.15, pLen * 0.05, 0, -pLen * 0.55, pLen * 0.95);
          grad.addColorStop(0, sp.base);
          grad.addColorStop(0.45, sp.mid);
          grad.addColorStop(0.86, sp.tip);
          grad.addColorStop(1, sp.edge);

          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          // Left curved margin
          ctx.bezierCurveTo(
            -pWid * (0.75 + seed.w1), -pLen * 0.25,
            -pWid * (1.05 + seed.w2), -pLen * 0.78,
            -pWid * 0.24, -pLen * 0.98
          );
          // Organic heart-shaped ruffled upper lip
          ctx.quadraticCurveTo(0, -pLen * (isPeony ? 0.86 : 0.91), pWid * 0.24, -pLen * 0.98);
          // Right curved margin
          ctx.bezierCurveTo(
            pWid * (1.05 - seed.w1), -pLen * 0.78,
            pWid * (0.75 - seed.w2), -pLen * 0.25,
            0, 0
          );
          ctx.fill();

          // Overlay organic silk/velvet micro-grain
          if (petalGrainPattern) {
            ctx.shadowColor = 'transparent';
            ctx.fillStyle = petalGrainPattern;
            ctx.fill();
          }

          // Delicate translucent petal veins
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.16)';
          ctx.lineWidth = 0.75;
          ctx.beginPath();
          ctx.moveTo(0, -pLen * 0.12);
          ctx.quadraticCurveTo(-pWid * 0.18, -pLen * 0.55, -pWid * 0.22, -pLen * 0.86);
          ctx.moveTo(0, -pLen * 0.12);
          ctx.quadraticCurveTo(pWid * 0.18, -pLen * 0.55, pWid * 0.22, -pLen * 0.86);
          ctx.stroke();

          // Crisp sunlit rim highlight on top lip of petal
          ctx.strokeStyle = sp.edge;
          ctx.globalAlpha = 0.45;
          ctx.lineWidth = 1.1;
          ctx.beginPath();
          ctx.moveTo(-pWid * 0.35, -pLen * 0.94);
          ctx.quadraticCurveTo(0, -pLen * (isPeony ? 0.86 : 0.91), pWid * 0.35, -pLen * 0.94);
          ctx.stroke();
          ctx.globalAlpha = 1;

          // Morning dewdrop on outer petals
          if (rIndex <= 1 && seed.hasDew && f.z > 0.55) {
            drawDewdrop(pWid * seed.dewX, -pLen * seed.dewY, seed.dewR * f.z);
          }

          ctx.restore();
        }
      });

      // Tightly spiraled rosebud center or golden peony stamen crown
      if (isPeony) {
        for (let s = 0; s < 22; s++) {
          const sa = (s / 22) * Math.PI * 2;
          const sl = r * (0.16 + (s % 3) * 0.03);
          ctx.strokeStyle = '#ffd166';
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(Math.cos(sa) * sl, Math.sin(sa) * sl);
          ctx.stroke();

          ctx.fillStyle = '#ff9e00';
          ctx.beginPath();
          ctx.arc(Math.cos(sa) * sl, Math.sin(sa) * sl, 1.8 * f.z, 0, Math.PI * 2);
          ctx.fill();
        }
      } else {
        // Spiraled rose heart
        for (let c = 0; c < 4; c++) {
          ctx.save();
          ctx.rotate(c * 1.45);
          const cr = r * (0.17 - c * 0.028);
          const cGrad = ctx.createRadialGradient(0, 0, 1, 0, 0, cr);
          cGrad.addColorStop(0, sp.base);
          cGrad.addColorStop(0.75, sp.mid);
          cGrad.addColorStop(1, sp.tip);
          ctx.fillStyle = cGrad;
          ctx.beginPath();
          ctx.arc(cr * 0.25, 0, cr, 0, Math.PI * 1.65);
          ctx.fill();
          ctx.restore();
        }
      }
    } else if (sp.type === 'lily') {
      // 6 recurved Stargazer Lily tepals (3 outer, 3 inner) with nectar spots & 6 anthers
      for (let tier = 0; tier < 2; tier++) {
        const count = 3;
        const rotOffset = tier * (Math.PI / 3);
        const pLen = r * (tier === 0 ? 1.08 : 1.0);
        const pWid = r * (tier === 0 ? 0.34 : 0.40);

        for (let i = 0; i < count; i++) {
          const angle = (i / count) * Math.PI * 2 + rotOffset;
          ctx.save();
          ctx.rotate(angle);

          ctx.shadowColor = 'rgba(0,0,0,0.45)';
          ctx.shadowBlur = 8 * f.z;

          const grad = ctx.createLinearGradient(0, 0, 0, -pLen);
          grad.addColorStop(0, sp.base);
          grad.addColorStop(0.28, sp.mid);
          grad.addColorStop(0.82, sp.tip);
          grad.addColorStop(1, sp.edge);

          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.bezierCurveTo(-pWid, -pLen * 0.3, -pWid * 0.85, -pLen * 0.72, 0, -pLen);
          ctx.bezierCurveTo(pWid * 0.85, -pLen * 0.72, pWid, -pLen * 0.3, 0, 0);
          ctx.fill();

          // Central raised nectar furrow
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
          ctx.lineWidth = 1.6 * f.z;
          ctx.beginPath();
          ctx.moveTo(0, -pLen * 0.08);
          ctx.lineTo(0, -pLen * 0.82);
          ctx.stroke();

          // Authentic botanical crimson speckles near throat
          ctx.fillStyle = sp.spots || '#590d22';
          for (let d = 0; d < 10; d++) {
            const dy = -pLen * (0.22 + (d % 5) * 0.08);
            const dx = ((d % 2 === 0 ? 1 : -1) * (0.12 + (d % 3) * 0.1)) * pWid;
            ctx.beginPath();
            ctx.arc(dx, dy, 1.3 * f.z, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.restore();
        }
      }

      // 6 long graceful filaments with cinnamon-orange pollen anthers
      for (let s = 0; s < 6; s++) {
        const sa = (s / 6) * Math.PI * 2 + 0.25;
        const sl = r * 0.56;
        ctx.save();
        ctx.rotate(sa);
        ctx.strokeStyle = '#d8f3dc';
        ctx.lineWidth = 1.6 * f.z;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.quadraticCurveTo(r * 0.12, -sl * 0.5, 0, -sl);
        ctx.stroke();

        ctx.fillStyle = sp.core;
        ctx.beginPath();
        ctx.ellipse(0, -sl, 4.5 * f.z, 2.1 * f.z, 0.35, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }
    } else if (sp.type === 'sunflower') {
      // Double ring of pointed golden ray florets + Fibonacci spiral seed disk
      for (let tier = 0; tier < 2; tier++) {
        const count = 20;
        const pLen = r * (tier === 0 ? 1.08 : 0.94);
        const pWid = r * 0.17;
        for (let i = 0; i < count; i++) {
          const angle = (i / count) * Math.PI * 2 + tier * 0.15;
          ctx.save();
          ctx.rotate(angle);
          const grad = ctx.createLinearGradient(0, -r * 0.35, 0, -pLen);
          grad.addColorStop(0, sp.base);
          grad.addColorStop(0.35, sp.mid);
          grad.addColorStop(0.85, sp.tip);
          grad.addColorStop(1, sp.edge);
          ctx.fillStyle = grad;
          ctx.beginPath();
          ctx.moveTo(0, -r * 0.25);
          ctx.quadraticCurveTo(-pWid, -pLen * 0.65, 0, -pLen);
          ctx.quadraticCurveTo(pWid, -pLen * 0.65, 0, -r * 0.25);
          ctx.fill();
          ctx.restore();
        }
      }

      // Deep dark brown Fibonacci seed disk
      const diskR = r * 0.42;
      const diskGrad = ctx.createRadialGradient(0, 0, diskR * 0.1, 0, 0, diskR);
      diskGrad.addColorStop(0, '#1a0c04');
      diskGrad.addColorStop(0.75, '#3b1d0a');
      diskGrad.addColorStop(1, '#78350f');
      ctx.fillStyle = diskGrad;
      ctx.beginPath();
      ctx.arc(0, 0, diskR, 0, Math.PI * 2);
      ctx.fill();

      // Golden-angle (137.508 deg) phyllotaxis florets
      const goldenAngle = 2.39996323;
      const totalSeeds = 65;
      for (let k = 1; k <= totalSeeds; k++) {
        const sr = diskR * 0.92 * Math.sqrt(k / totalSeeds);
        const theta = k * goldenAngle;
        ctx.fillStyle = k > totalSeeds * 0.72 ? '#fbbf24' : '#713f12';
        ctx.beginPath();
        ctx.arc(Math.cos(theta) * sr, Math.sin(theta) * sr, Math.max(1.1, 1.8 * f.z), 0, Math.PI * 2);
        ctx.fill();
      }
    } else {
      // Wild Silk Poppy: 4 large crinkled tissue-paper petals + dark velvet eye
      const count = 5;
      for (let i = 0; i < count; i++) {
        const angle = (i / count) * Math.PI * 2;
        const pLen = r * 1.02;
        const pWid = r * 0.85;
        ctx.save();
        ctx.rotate(angle);
        ctx.shadowColor = 'rgba(0,0,0,0.45)';
        ctx.shadowBlur = 9 * f.z;

        const grad = ctx.createRadialGradient(0, 0, r * 0.08, 0, -pLen * 0.5, pLen);
        grad.addColorStop(0, sp.base);
        grad.addColorStop(0.26, '#140303');
        grad.addColorStop(0.32, sp.mid);
        grad.addColorStop(0.85, sp.tip);
        grad.addColorStop(1, sp.edge);

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.bezierCurveTo(-pWid, -pLen * 0.22, -pWid * 1.1, -pLen * 0.88, 0, -pLen * 0.96);
        ctx.bezierCurveTo(pWid * 1.1, -pLen * 0.88, pWid, -pLen * 0.22, 0, 0);
        ctx.fill();

        if (petalGrainPattern) {
          ctx.fillStyle = petalGrainPattern;
          ctx.fill();
        }
        ctx.restore();
      }

      // Velvet seed pod & dark stamen ring
      ctx.fillStyle = '#386641';
      ctx.beginPath();
      ctx.arc(0, 0, r * 0.16, 0, Math.PI * 2);
      ctx.fill();

      for (let s = 0; s < 18; s++) {
        const sa = (s / 18) * Math.PI * 2;
        ctx.strokeStyle = '#111111';
        ctx.lineWidth = 1.3;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(Math.cos(sa) * r * 0.26, Math.sin(sa) * r * 0.26);
        ctx.stroke();
      }
    }

    ctx.restore();
  }

  function draw3DButterfly(b) {
    b.wingPhase += b.wingSpeed;
    b.x += b.vx;
    b.y += b.vy + Math.sin(b.wingPhase * 0.22) * 0.5;

    if (b.x < -70) b.x = width + 70;
    if (b.x > width + 70) b.x = -70;
    if (b.y < 60) b.vy = Math.abs(b.vy);
    if (b.y > height - 80) b.vy = -Math.abs(b.vy);

    const flap = Math.cos(b.wingPhase);
    const wingScaleX = Math.max(0.18, Math.abs(flap));
    const heading = Math.atan2(b.vy, b.vx) + Math.PI / 2;

    const schemes = [
      { top: '#ffb703', mid: '#fb8500', edge: '#1a0a00', dot: '#fff8e7' },
      { top: '#90e0ef', mid: '#0077b6', edge: '#03045e', dot: '#caf0f8' },
      { top: '#ffccd5', mid: '#c9184a', edge: '#2b0510', dot: '#fff0f3' }
    ];
    const col = schemes[b.scheme];

    ctx.save();
    ctx.translate(b.x + mouseX * 32 * b.z, b.y + mouseY * 20 * b.z);
    ctx.rotate(heading);
    ctx.scale(b.scale, b.scale);

    [-1, 1].forEach((side) => {
      ctx.save();
      ctx.scale(side * wingScaleX, 1);

      const wingGrad = ctx.createRadialGradient(8, -6, 2, 18, -8, 28);
      wingGrad.addColorStop(0, col.top);
      wingGrad.addColorStop(0.75, col.mid);
      wingGrad.addColorStop(1, col.edge);

      ctx.fillStyle = wingGrad;
      ctx.shadowColor = 'rgba(0,0,0,0.45)';
      ctx.shadowBlur = 9;

      // Forewing
      ctx.beginPath();
      ctx.moveTo(0, -2);
      ctx.bezierCurveTo(16, -25, 35, -18, 28, 2);
      ctx.bezierCurveTo(22, 8, 8, 5, 0, 2);
      ctx.fill();

      // Hindwing
      ctx.beginPath();
      ctx.moveTo(0, 2);
      ctx.bezierCurveTo(22, 4, 24, 23, 10, 25);
      ctx.bezierCurveTo(3, 22, 1, 12, 0, 4);
      ctx.fill();

      ctx.fillStyle = col.dot;
      ctx.beginPath();
      ctx.arc(21, -8, 2.1, 0, Math.PI * 2);
      ctx.arc(15, 13, 1.6, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    });

    ctx.fillStyle = '#140e0b';
    ctx.beginPath();
    ctx.ellipse(0, 2, 2.1, 11, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  function drawAtmosphere(time) {
    // Rich dusk botanical garden sky & warm sunlight ray backdrop
    const skyGrad = ctx.createLinearGradient(0, 0, 0, height);
    skyGrad.addColorStop(0, '#07120e');
    skyGrad.addColorStop(0.45, '#0e2219');
    skyGrad.addColorStop(0.82, '#132a1f');
    skyGrad.addColorStop(1, '#06110c');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(0, 0, width, height);

    // Warm golden-hour sunbeam from top center
    const sunBeam = ctx.createRadialGradient(width * 0.5, height * 0.15, 10, width * 0.5, height * 0.35, Math.max(width, height) * 0.75);
    sunBeam.addColorStop(0, 'rgba(255, 226, 175, 0.16)');
    sunBeam.addColorStop(0.45, 'rgba(255, 185, 145, 0.06)');
    sunBeam.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = sunBeam;
    ctx.fillRect(0, 0, width, height);

    // Soft photographic bokeh circles in background
    bokehOrbs.forEach((orb) => {
      orb.x += orb.vx;
      orb.y += orb.vy;
      if (orb.x < -orb.r) orb.x = width + orb.r;
      if (orb.x > width + orb.r) orb.x = -orb.r;
      if (orb.y < -orb.r) orb.y = height + orb.r;
      if (orb.y > height + orb.r) orb.y = -orb.r;

      ctx.fillStyle = orb.color;
      ctx.beginPath();
      ctx.arc(orb.x + mouseX * 10, orb.y + mouseY * 8, orb.r, 0, Math.PI * 2);
      ctx.fill();
    });

    // Subtle meadow grass silhouettes along bottom
    grassBlades.forEach((g) => {
      const sway = Math.sin(time * 0.015 + g.phase) * 14;
      ctx.strokeStyle = g.shade;
      ctx.lineWidth = g.w;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(g.x, height + 10);
      ctx.quadraticCurveTo(g.x + g.lean * 0.4, height - g.h * 0.5, g.x + g.lean + sway, height - g.h);
      ctx.stroke();
    });

    // Floating golden pollen & warm fireflies
    pollen.forEach((p) => {
      p.x += p.vx;
      p.y += p.vy;
      p.phase += 0.03;
      if (p.y < -10) {
        p.y = height + 10;
        p.x = Math.random() * width;
      }
      const alpha = 0.25 + (Math.sin(p.phase) * 0.5 + 0.5) * 0.6;
      ctx.fillStyle = `rgba(255, 232, 165, ${alpha})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    });

    // Drifting rose petals
    fallingPetals.forEach((pt) => {
      pt.y += pt.vy;
      pt.x += pt.vx + Math.sin(pt.rot) * 0.45;
      pt.rot += pt.vRot;
      pt.flip += 0.038;
      if (pt.y > height + 20) {
        pt.y = -20;
        pt.x = Math.random() * width;
      }

      ctx.save();
      ctx.translate(pt.x, pt.y);
      ctx.rotate(pt.rot);
      ctx.scale(1, Math.max(0.25, Math.abs(Math.cos(pt.flip))));
      const pg = ctx.createRadialGradient(0, 0, 1, 0, 0, pt.size);
      pg.addColorStop(0, pt.c1);
      pg.addColorStop(1, pt.c2);
      ctx.fillStyle = pg;
      ctx.globalAlpha = 0.68;
      ctx.beginPath();
      ctx.moveTo(0, -pt.size);
      ctx.bezierCurveTo(pt.size * 0.9, -pt.size * 0.4, pt.size * 0.8, pt.size * 0.7, 0, pt.size);
      ctx.bezierCurveTo(-pt.size * 0.8, pt.size * 0.7, -pt.size * 0.9, -pt.size * 0.4, 0, -pt.size);
      ctx.fill();
      ctx.restore();
    });
  }

  let frameTime = 0;
  function animate() {
    frameTime += 1;
    mouseX += (targetMouseX - mouseX) * 0.05;
    mouseY += (targetMouseY - mouseY) * 0.05;

    ctx.clearRect(0, 0, width, height);

    drawAtmosphere(frameTime);
    flowers.forEach((f) => drawRealisticBloom(f, frameTime));
    butterflies.forEach((b) => draw3DButterfly(b));

    requestAnimationFrame(animate);
  }

  window.onload = function () {
    resizeCanvas();
    initEnvironment();
    buildSceneForSlide(0);
    animate();
  };
})();
</script>
</body>
